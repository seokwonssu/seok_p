<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>석p</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --text:#f0ede8;
  --sub:#888;
  --dim:#555;
  --border:rgba(255,255,255,0.08);
  --accent:#c0aed8;
  --ph:72px;
}
html,body{
  background:#080808;color:var(--text);
  font-family:'DM Sans',sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}

.bg-art{
  position:fixed;inset:-30px;z-index:0;
  background:url('Voyager/Cover.jpg') center/cover no-repeat;
  filter:blur(72px) brightness(0.28) saturate(1.4);
}
.bg-overlay{position:fixed;inset:0;z-index:1;background:rgba(0,0,0,0.5)}

/* ── HEADER ── */
header{
  position:relative;z-index:2;
  padding:40px 56px 36px;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:14px;font-weight:400;letter-spacing:0.01em}
.header-ig{
  display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--sub);text-decoration:none;
  transition:color 0.15s;
}
.header-ig:hover{color:var(--text)}
.header-ig svg{opacity:0.7;transition:opacity 0.15s;flex-shrink:0}
.header-ig:hover svg{opacity:1}

@media(max-width:600px){header{padding:32px 24px 28px}}

/* ── HERO ── */
.hero{
  position:relative;z-index:2;
  padding:16px 56px 48px;
  display:flex;gap:36px;align-items:flex-end;
}
.hero-cover{
  width:148px;height:148px;flex-shrink:0;
  border-radius:12px;object-fit:cover;
  box-shadow:0 20px 60px rgba(0,0,0,0.6),0 4px 20px rgba(0,0,0,0.4);
}
.hero-label{
  font-size:11px;color:var(--sub);
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px;
}
.hero-title{
  font-family:'DM Serif Display',serif;
  font-size:clamp(44px,6vw,62px);
  font-weight:400;line-height:1;letter-spacing:-0.02em;margin-bottom:12px;
}
.hero-meta{font-size:13px;color:var(--sub)}

@media(max-width:600px){
  .hero{padding:12px 24px 36px;gap:20px;flex-direction:column;align-items:flex-start}
  .hero-cover{width:112px;height:112px}
}

/* ── DIVIDER ── */
.divider{
  position:relative;z-index:2;
  border:none;border-top:0.5px solid var(--border);
  margin:0 56px;
}
@media(max-width:600px){.divider{margin:0 24px}}

/* ── TRACKLIST ── */
.tracklist{
  position:relative;z-index:2;
  padding:0 44px calc(var(--ph) + 48px);
}
@media(max-width:600px){.tracklist{padding:0 12px calc(var(--ph) + 28px)}}

.season-header{
  display:flex;align-items:center;gap:8px;
  padding:32px 12px 6px;
  font-size:11px;color:var(--dim);
  letter-spacing:0.12em;text-transform:uppercase;
  user-select:none;
}
.season-pill{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.spring .season-pill{background:#c4a8d0}
.summer .season-pill{background:#7cc9a0}
.autumn .season-pill{background:#d4956a}
.winter .season-pill{background:#7aadd4}

.track{
  display:grid;
  grid-template-columns:48px 1fr auto;
  align-items:center;
  gap:0 8px;
  padding:9px 12px;border-radius:8px;
  cursor:pointer;transition:background 0.12s;
  position:relative;margin:1px 0;user-select:none;
}
.track:hover{background:rgba(255,255,255,0.05)}
.track.playing{background:rgba(192,174,216,0.1)}

.track-num{
  font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums;
  text-align:right;padding-right:4px;
  position:relative;
}
.track-num-text{transition:opacity 0.15s}
.track.playing .track-num-text{opacity:0}

@keyframes bar{0%,100%{transform:scaleY(0.2)}50%{transform:scaleY(1)}}
.bars{
  position:absolute;inset:0;
  display:none;align-items:center;justify-content:flex-end;padding-right:4px;gap:2px;
}
.bars span{
  width:2px;height:10px;border-radius:1px;
  background:var(--accent);transform-origin:center;
}
.bars span:nth-child(1){animation:bar 0.85s ease infinite 0s}
.bars span:nth-child(2){animation:bar 0.85s ease infinite 0.22s}
.bars span:nth-child(3){animation:bar 0.85s ease infinite 0.11s}
.track.playing:not(.paused) .bars{display:flex}

.track-name{
  font-size:14px;color:var(--text);font-weight:300;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.4;
}
.track.theme-track .track-name{
  color:rgba(240,237,232,0.28);
}
.track.playing .track-name,
.track.playing.theme-track .track-name{color:var(--accent)}

.track-dur{
  font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;padding-left:12px;
}

/* ── PLAYER ── */
#player{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  height:var(--ph);
  background:rgba(8,8,8,0.9);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border-top:0.5px solid var(--border);
  display:flex;align-items:center;
  padding:0 32px;gap:20px;
  transform:translateY(100%);
  transition:transform 0.4s cubic-bezier(.4,0,.2,1);
}
#player.visible{transform:translateY(0)}

.p-cover{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-track{
  font-size:13px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.p-sub{font-size:11px;color:var(--sub);letter-spacing:0.02em}

.p-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.p-btn{
  background:none;border:none;cursor:pointer;
  color:var(--sub);padding:6px;transition:color 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.p-btn:hover{color:var(--text)}
.p-play{
  width:32px;height:32px;border-radius:50%;
  background:var(--text);color:#080808;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;flex-shrink:0;transition:opacity 0.15s;
}
.p-play:hover{opacity:0.75}

.p-right{flex:2;display:flex;align-items:center;gap:10px;min-width:0;max-width:400px}
.p-bar-wrap{
  flex:1;height:2px;background:rgba(255,255,255,0.1);
  cursor:pointer;border-radius:99px;
}
.p-fill{height:100%;background:rgba(255,255,255,0.3);width:0%;border-radius:99px;transition:width 0.3s linear}
.p-bar-wrap:hover .p-fill{background:var(--accent)}
.p-time{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}

.p-vol{display:flex;align-items:center;gap:6px;flex-shrink:0}
.vol-slider{
  -webkit-appearance:none;appearance:none;
  width:60px;height:2px;border-radius:99px;
  outline:none;cursor:pointer;
  background:linear-gradient(to right,rgba(255,255,255,0.4) 100%,rgba(255,255,255,0.1) 100%);
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;
  border-radius:50%;background:var(--text);cursor:pointer;
  transition:transform 0.1s;
}
.vol-slider:hover::-webkit-slider-thumb{transform:scale(1.3)}
.vol-slider::-moz-range-thumb{
  width:10px;height:10px;border:none;border-radius:50%;
  background:var(--text);cursor:pointer;
}

@media(max-width:600px){.p-right{display:none}}

audio{display:none}
</style>
</head>
<body>

<div class="bg-art" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<header>
  <span class="logo">석p</span>
  <a class="header-ig" href="https://www.instagram.com/1619khz___/" target="_blank" rel="noopener">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
    </svg>
    @1619khz___
  </a>
</header>

<div class="hero">
  <img class="hero-cover" src="Voyager/Cover.jpg" alt="Voyager"/>
  <div class="hero-info">
    <div class="hero-label">Mixtape &nbsp;·&nbsp; 2023</div>
    <div class="hero-title">Voyager.</div>
    <div class="hero-meta">석p &nbsp;·&nbsp; 12 tracks</div>
  </div>
</div>

<hr class="divider"/>

<div class="tracklist" id="tracklist"></div>

<div id="player">
  <img class="p-cover" src="Voyager/Cover.jpg" alt="cover"/>
  <div class="p-info">
    <div class="p-track" id="p-track">—</div>
    <div class="p-sub">Voyager. &nbsp;·&nbsp; 석p</div>
  </div>
  <div class="p-controls">
    <button class="p-btn" onclick="prevTrack()" aria-label="이전">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor">
        <rect x="0" y="0" width="2" height="13" rx="1"/>
        <path d="M12 1L4 6.5L12 12Z"/>
      </svg>
    </button>
    <button class="p-play" id="p-play-btn" onclick="togglePlay()" aria-label="재생/일시정지">
      <svg id="icon-play" width="11" height="11" viewBox="0 0 11 11" fill="currentColor">
        <path d="M2 1L10 5.5L2 10Z"/>
      </svg>
      <svg id="icon-pause" width="11" height="11" viewBox="0 0 11 11" fill="currentColor" style="display:none">
        <rect x="1" y="0" width="3.5" height="11" rx="1"/>
        <rect x="6.5" y="0" width="3.5" height="11" rx="1"/>
      </svg>
    </button>
    <button class="p-btn" onclick="nextTrack()" aria-label="다음">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor">
        <rect x="11" y="0" width="2" height="13" rx="1"/>
        <path d="M1 1L9 6.5L1 12Z"/>
      </svg>
    </button>
  </div>
  <div class="p-right">
    <span class="p-time" id="p-cur">0:00</span>
    <div class="p-bar-wrap" onclick="seekBar(event)">
      <div class="p-fill" id="p-fill"></div>
    </div>
    <span class="p-time" id="p-dur">—</span>
    <div class="p-vol">
      <button class="p-btn" onclick="toggleMute()" aria-label="볼륨">
        <svg id="vol-on" width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <path d="M2 5H0.5v4H2l4 2.8V2.2L2 5z"/>
          <path d="M8.5 4.8c.7.6 1.1 1.4 1.1 2.2s-.4 1.6-1.1 2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M10.5 2.8c1.2.9 1.9 2.4 1.9 4.2s-.7 3.3-1.9 4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <svg id="vol-off" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" style="display:none">
          <path d="M2 5H0.5v4H2l4 2.8V2.2L2 5z"/>
          <path d="M9 5l3.5 4M12.5 5L9 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVol(this.value)"/>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const seasons = [
  {
    id:'spring', label:'Spring',
    tracks:[
      {num:'01',   title:'Spring Theme',    src:'Voyager/01. Spring Theme.mp3',      theme:true},
      {num:'01-a', title:'3월의 사진사',     src:'Voyager/01-a. 3월의 사진사.mp3',    theme:false},
      {num:'01-b', title:'Loading⋯',         src:'Voyager/01-b. Loading⋯.mp3',        theme:false},
    ]
  },
  {
    id:'summer', label:'Summer',
    tracks:[
      {num:'02',   title:'Summer Theme',    src:'Voyager/02. Summer Theme.mp3',      theme:true},
      {num:'02-a', title:'나이트플라이어',   src:'Voyager/02-a. 나이트플라이어.mp3',   theme:false},
      {num:'02-b', title:'앨저넌에게 꽃을',  src:'Voyager/02-b. 앨저넌에게 꽃을.mp3', theme:false},
    ]
  },
  {
    id:'autumn', label:'Autumn',
    tracks:[
      {num:'03',   title:'Autumn Theme',    src:'Voyager/03. Autumn Theme.mp3',      theme:true},
      {num:'03-a', title:'matinée',          src:'Voyager/03-a. matinée.mp3',          theme:false},
      {num:'03-b', title:'서표',              src:'Voyager/03-b. 서표.mp3',             theme:false},
    ]
  },
  {
    id:'winter', label:'Winter',
    tracks:[
      {num:'04',   title:'Winter Theme',    src:'Voyager/04. Winter Theme.mp3',      theme:true},
      {num:'04-a', title:'라마와의 랑데부',  src:'Voyager/04-a. 라마와의 랑데부.mp3',  theme:false},
      {num:'04-b', title:'soirée',           src:'Voyager/04-b. soirée.mp3',           theme:false},
    ]
  }
];

const allTracks = seasons.flatMap(s => s.tracks);
let currentIdx = -1, isPlaying = false;
const audio = document.getElementById('audio');

const container = document.getElementById('tracklist');
let gi = 0;
seasons.forEach(season => {
  const hdr = document.createElement('div');
  hdr.className = `season-header ${season.id}`;
  hdr.innerHTML = `<span class="season-pill"></span>${season.label}`;
  container.appendChild(hdr);
  season.tracks.forEach(track => {
    const idx = gi++;
    const row = document.createElement('div');
    row.className = 'track' + (track.theme ? ' theme-track' : '');
    row.id = `t${idx}`;
    row.onclick = () => playTrack(idx);
    row.innerHTML = `
      <div class="track-num">
        <span class="track-num-text">${track.num}</span>
        <div class="bars"><span></span><span></span><span></span></div>
      </div>
      <span class="track-name">${track.title}</span>
      <span class="track-dur" id="dur${idx}">—</span>
    `;
    container.appendChild(row);
  });
});

function playTrack(idx) {
  if (currentIdx >= 0) document.getElementById(`t${currentIdx}`).classList.remove('playing','paused');
  currentIdx = idx;
  document.getElementById(`t${idx}`).classList.add('playing');
  document.getElementById('p-track').textContent = allTracks[idx].title;
  document.getElementById('player').classList.add('visible');
  audio.src = allTracks[idx].src;
  audio.play().then(() => setPlaying(true)).catch(() => setPlaying(true));
}

function setPlaying(val) {
  isPlaying = val;
  document.getElementById('icon-play').style.display = val ? 'none' : '';
  document.getElementById('icon-pause').style.display = val ? '' : 'none';
  const row = document.getElementById(`t${currentIdx}`);
  if (row) val ? row.classList.remove('paused') : row.classList.add('paused');
}

function togglePlay() {
  if (currentIdx < 0) return;
  if (isPlaying) { audio.pause(); setPlaying(false); }
  else { audio.play().then(() => setPlaying(true)); }
}

function prevTrack() { if (currentIdx > 0) playTrack(currentIdx - 1); }
function nextTrack() { if (currentIdx < allTracks.length - 1) playTrack(currentIdx + 1); }

function seekBar(e) {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

function fmt(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

// volume
let lastVol = 1;
function setVol(v) {
  v = parseFloat(v);
  audio.volume = v;
  audio.muted = v === 0;
  if (v > 0) lastVol = v;
  updateVolIcon(v);
  updateSliderFill(v);
}
function toggleMute() {
  if (audio.muted || audio.volume === 0) {
    audio.muted = false;
    audio.volume = lastVol;
    document.getElementById('vol-slider').value = lastVol;
    updateVolIcon(lastVol);
    updateSliderFill(lastVol);
  } else {
    lastVol = audio.volume;
    audio.muted = true;
    document.getElementById('vol-slider').value = 0;
    updateVolIcon(0);
    updateSliderFill(0);
  }
}
function updateVolIcon(v) {
  document.getElementById('vol-on').style.display = v > 0 ? '' : 'none';
  document.getElementById('vol-off').style.display = v > 0 ? 'none' : '';
}
function updateSliderFill(v) {
  const pct = (v * 100).toFixed(1);
  document.getElementById('vol-slider').style.background =
    `linear-gradient(to right,rgba(255,255,255,0.4) ${pct}%,rgba(255,255,255,0.1) ${pct}%)`;
}

// preload all track durations
allTracks.forEach((track, idx) => {
  const a = new Audio();
  a.preload = 'metadata';
  a.src = track.src;
  a.addEventListener('loadedmetadata', () => {
    const el = document.getElementById(`dur${idx}`);
    if (el) el.textContent = fmt(a.duration);
  });
});

audio.addEventListener('loadedmetadata', () => {
  const dur = fmt(audio.duration);
  const el = document.getElementById(`dur${currentIdx}`);
  if (el) el.textContent = dur;
  document.getElementById('p-dur').textContent = dur;
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  document.getElementById('p-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  document.getElementById('p-cur').textContent = fmt(audio.currentTime);
});
audio.addEventListener('ended', () => {
  if (currentIdx < allTracks.length - 1) playTrack(currentIdx + 1);
  else setPlaying(false);
});
</script>
</body>
</html>
